name: Publikacja MaFiAnGo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki aplikacji
        uses: actions/checkout@v4

      - name: Zaloguj do Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Zainstaluj Firebase CLI
        run: npm install -g firebase-tools

      - name: Opublikuj aplikacje
        run: firebase deploy --only hosting --project mafiango-ad466 --non-interactive
