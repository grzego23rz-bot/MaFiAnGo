:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#27314f;background:#f8f7ff}

</style></head><body><div class="wrap"><header class="hero"><strong>🏡 MaFiAnGo</strong><h1 id="hello">Rodzinna ekipa 👋</h1><span id="who" class="tag">Wspólne zakupy i zadania</span></header><section class="panel" id="login"><h2>🔐 Wybierz swój profil</h2><label for="profile">Kto korzysta z aplikacji?</label><select id="profile"><option value="tata">👑 Tata</option><option value="marcel">🎮 Marcel</option><option value="filip">⚽ Filip</option><option value="antek">🦸 Antek</option></select><label for="password">Hasło do swojego konta</label><input id="password" type="password" autocomplete="current-password" placeholder="Wpisz hasło"><button class="primary" id="loginBtn">Zaloguj się</button><p class="muted">Każdy loguje się na swoje konto Supabase. Hasło pozostaje na Twoim telefonie.</p><p class="error" id="loginError" role="alert"></p></section><section id="app" class="hide"><section class="panel"><div class="row"><div style="flex:1"><strong id="accountName"></strong><div class="muted">Dane wspólne dla całej rodziny</div></div><button class="secondary" id="logout">Wyloguj</button></div><p id="status" class="muted" role="status">Łączenie z bazą…</p><button class="secondary" id="refresh">↻ Odśwież dane</button></section><div class="tabs"><button data-tab="zakupy" class="active">🛒 Zakupy</button><button data-tab="zadania">✅ Zadania</button></div><section class="panel" id="content"></section></section><footer>MaFiAnGo • REST • styl rodzinny 16.10d</footer></div><script>
'use strict';
const URL='https://wphgyimjbnlnzhwpakmw.supabase.co';
const KEY='sb_publishable_zU7T-Y1klhyUpaRywWhLGg__uc_x1NG';
// MaFiAnGo REST: bez zewnętrznych bibliotek JavaScript.
const STORE='mafiango_auth_v2';
let session=null;
try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){localStorage.removeItem(STORE)}
function saveSession(s){session=s;if(s)localStorage.setItem(STORE,JSON.stringify(s));else localStorage.removeItem(STORE)}
async function request(path,method='GET',body=null,access=null,extra={}){
  const headers={'apikey':KEY,'Content-Type':'application/json',...extra};
  if(access)headers.Authorization='Bearer '+access;
  const response=await fetch(URL+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});
  const raw=await response.text();let data=null;
  try{data=raw?JSON.parse(raw):null}catch(e){data={message:raw.slice(0,200)}}
  if(!response.ok)throw Error(data?.msg||data?.message||data?.error_description||data?.error||('HTTP '+response.status));
  return data;
}
async function accessToken(){
  if(!session?.access_token)return null;
  if(Date.now()<(session.expires_at||0)*1000-60000)return session.access_token;
  if(!session.refresh_token){saveSession(null);return null}
  try{
    const next=await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});
    saveSession({...next,expires_at:Math.floor(Date.now()/1000)+next.expires_in});
    return session.access_token;
  }catch(e){saveSession(null);throw Error('Sesja wygasła. Zaloguj się ponownie. '+e.message)}
}
class TableQuery{
  constructor(table){this.table=table;this.method='GET';this.columns='*';this.filters=[];this.payload=null;this.sort=null;this.count=null}
  select(cols){this.columns=cols;return this}
  eq(field,value){this.filters.push([field,'eq.'+String(value)]);return this}
  limit(n){this.count=n;return this}
  order(field,{ascending=true}={}){this.sort=field+'.'+(ascending?'asc':'desc');return this}
  insert(value){this.method='POST';this.payload=value;return this}
  update(value){this.method='PATCH';this.payload=value;return this}
  delete(){this.method='DELETE';return this}
  async execute(){
    try{
      const token=await accessToken();if(!token)throw Error('Nie jesteś zalogowany.');
      const qs=new URLSearchParams();if(this.method==='GET')qs.set('select',this.columns);
      for(const [k,v] of this.filters)qs.append(k,v);
      if(this.sort)qs.set('order',this.sort);
      if(this.count!==null)qs.set('limit',String(this.count));
      const data=await request('/rest/v1/'+encodeURIComponent(this.table)+'?'+qs.toString(),this.method,this.payload,token,{'Prefer':this.method==='GET'?'':'return=minimal'});
      return {data:this.method==='GET'?data:null,error:null};
    }catch(error){return {data:null,error}}
  }
  then(ok,fail){return this.execute().then(ok,fail)}
}
const client={
  from(table){return new TableQuery(table)},
  auth:{
    async signInWithPassword({email,password}){
      try{
        const data=await request('/auth/v1/token?grant_type=password','POST',{email,password});
        saveSession({...data,expires_at:Math.floor(Date.now()/1000)+data.expires_in});
        return {data:{user:data.user},error:null};
      }catch(error){return {data:null,error}}
    },
    async getUser(){
      try{
        const token=await accessToken();if(!token)return {data:{user:null},error:null};
        const user=await request('/auth/v1/user','GET',null,token);
        return {data:{user},error:null};
      }catch(error){return {data:{user:null},error}}
    },
    async signOut(){saveSession(null);return {error:null}}
  }
};
const accounts={tata:{name:'Tata',email:'grzego23rz@gmail.com'},marcel:{name:'Marcel',email:'marcellech17@gmail.com'},filip:{name:'Filip',email:'filipmalpka511@gmail.com'},antek:{name:'Antek',email:'antekhuczko@gmail.com'}};
let current=null,familyId=null,members=[],shopping=[],tasks=[],tab='zakupy',busy=false;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function err(e){return e?.message||String(e)}
function status(s,isError=false){el('status').textContent=s;el('status').className=isError?'error':'muted'}
function nameOf(id){return members.find(x=>x.user_id===id||x.id===id)?.name||'Domownik'}
function memberId(key){const n=accounts[key].name.toLowerCase();return members.find(m=>String(m.name).toLowerCase()===n)?.id||null}
async function login(){el('loginError').textContent='';if(!client){el('loginError').textContent='Nie udało się uruchomić aplikacji.';return;}const key=el('profile').value;const password=el('password').value;if(!password){el('loginError').textContent='Wpisz hasło.';return}el('loginBtn').disabled=true;try{const {data,error}=await client.auth.signInWithPassword({email:accounts[key].email,password});if(error)throw error;el('password').value='';await start(data.user)}catch(e){el('loginError').textContent='Nie udało się zalogować: '+err(e)}finally{el('loginBtn').disabled=false}}
async function start(user){current=Object.keys(accounts).find(k=>accounts[k].email.toLowerCase()===String(user.email).toLowerCase());if(!current){await client.auth.signOut();throw Error('To konto nie należy do skonfigurowanych profili MaFiAnGo.')}el('login').classList.add('hide');el('app').classList.remove('hide');el('hello').textContent='Cześć, '+accounts[current].name+'! 👋';el('who').textContent=current==='tata'?'Panel rodzica':'Panel domownika';el('accountName').textContent='Zalogowano: '+accounts[current].name;await load()}
async function load(){status('Pobieranie danych…');try{const {data:userData,error:userError}=await client.auth.getUser();if(userError)throw userError;const uid=userData.user?.id;if(!uid)throw Error('Sesja wygasła. Zaloguj się ponownie.');let r=await client.from('family_members').select('id,family_id,name,user_id,role').eq('user_id',uid).limit(1);if(r.error)throw r.error;familyId=r.data?.[0]?.family_id;if(!familyId){const own=await client.from('families').select('id').eq('owner_id',uid).limit(1);if(own.error)throw own.error;familyId=own.data?.[0]?.id}if(!familyId)throw Error('Nie znaleziono rodziny powiązanej z tym kontem. W Supabase trzeba powiązać użytkownika z rodziną.');const [m,s,t]=await Promise.all([client.from('family_members').select('id,family_id,name,user_id,role').eq('family_id',familyId),client.from('shopping_items').select('id,text,done,created_by,created_at').eq('family_id',familyId).order('created_at',{ascending:false}),client.from('tasks').select('id,text,done,assigned_to,created_at').eq('family_id',familyId).order('created_at',{ascending:false})]);for(const r of [m,s,t])if(r.error)throw r.error;members=m.data||[];shopping=s.data||[];tasks=t.data||[];status('✓ Połączono z Supabase • '+new Date().toLocaleTimeString('pl-PL'));render()}catch(e){status('Błąd synchronizacji: '+err(e),true);render()}}
async function mutation(query){if(busy)return;busy=true;status('Zapisywanie…');try{const {error}=await query;if(error)throw error;await load()}catch(e){status('Nie zapisano zmiany: '+err(e),true)}finally{busy=false}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const isDad=current==='tata';if(!familyId){el('content').innerHTML='<h2>Połączenie z rodziną</h2><p class="muted">Najpierw trzeba poprawnie powiązać konto z rodziną w Supabase.</p>';return}if(tab==='zakupy'){el('content').innerHTML='<h2>🛒 Lista zakupów</h2><form id="addShopping" class="row"><input id="newShopping" maxlength="120" required placeholder="Co trzeba kupić?"><button class="primary">Dodaj</button></form><div id="items">'+(shopping.map(x=>'<div class="item"><span class="label">'+esc(x.text)+'</span><button class="secondary" data-buy="'+esc(x.id)+'">✓ Kupione</button></div>').join('')||'<p class="muted">Lista jest pusta.</p>')+'</div>';el('addShopping').onsubmit=e=>{e.preventDefault();const text=el('newShopping').value.trim();if(text)mutation(client.from('shopping_items').insert({family_id:familyId,text,done:false,created_by:session?.user?.id||null}))};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>mutation(client.from('shopping_items').delete().eq('id',b.dataset.buy).eq('family_id',familyId)));return}const visible=isDad?tasks:tasks.filter(x=>x.assigned_to===memberId(current));const options=members.filter(m=>m.name&&String(m.name).toLowerCase()!=='tata'&&m.id).map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('');el('content').innerHTML='<h2>✅ Zadania domowe</h2>'+(isDad?'<form id="addTask"><input id="newTask" maxlength="120" required placeholder="Jakie zadanie?"><select id="assigned">'+options+'</select><button class="primary" '+(!options?'disabled':'')+'>Dodaj zadanie</button></form>':'<p class="muted">Zadania przydziela i zatwierdza Tata.</p>')+(visible.map(x=>'<div class="item"><span class="label" style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(x.text)+'<div class="muted">'+esc(nameOf(x.assigned_to))+'</div></span>'+(isDad?'<button class="secondary" data-done="'+esc(x.id)+'" data-state="'+(x.done?'1':'0')+'">'+(x.done?'↩':'✓')+'</button><button class="secondary" data-del="'+esc(x.id)+'">×</button>':'')+'</div>').join('')||'<p class="muted">Brak zadań.</p>');if(isDad){el('addTask').onsubmit=e=>{e.preventDefault();const text=el('newTask').value.trim(),assigned_to=el('assigned').value;if(text&&assigned_to)mutation(client.from('tasks').insert({family_id:familyId,text,assigned_to,done:false}))};document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>mutation(client.from('tasks').update({done:b.dataset.state!=='1'}).eq('id',b.dataset.done).eq('family_id',familyId)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>mutation(client.from('tasks').delete().eq('id',b.dataset.del).eq('family_id',familyId)))}}
el('loginBtn').onclick=login;el('loginBtn').setAttribute('data-ready','tak');el('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});el('refresh').onclick=load;el('logout').onclick=async()=>{await client.auth.signOut();current=null;familyId=null;members=[];shopping=[];tasks=[];el('app').classList.add('hide');el('login').classList.remove('hide');el('hello').textContent='Rodzinna ekipa 👋';el('who').textContent='Wspólne zakupy i zadania'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(client){client.auth.getUser().then(({data})=>{if(data.user)start(data.user).catch(e=>{el('loginError').textContent=err(e);el('app').classList.add('hide');el('login').classList.remove('hide')})}).catch(e=>{el('loginError').textContent='Błąd połączenia: '+err(e)});}else{el('loginError').textContent='Nie udało się załadować Supabase. Logowanie jest chwilowo niedostępne.';}
</script></body></html>
