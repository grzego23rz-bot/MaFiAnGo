const STORE='mafiango_auth_v2';
let session=null;
try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){localStorage.removeItem(STORE)}
function saveSession(s){session=s;if(s)localStorage.setItem(STORE,JSON.stringify(s));else localStorage.removeItem(STORE)}
async function request(path,method='GET',body=null,access=null,extra={}){
  const headers={'apikey':KEY,'Content-Type':'application/json',...extra};
  if(access)headers.Authorization='Bearer '+access;
  const response=await fetch(URL+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});

  try{data=raw?JSON.parse(raw):null}catch(e){data={message:raw.slice(0,200)}}

  return data;
}
async function accessToken(){
  if(!session?.access_token)return null;
  if(Date.now()<(session.expires_at||0)*1000-60000)return session.access_token;
  if(!session.refresh_token){saveSession(null);return null}
  try{
    const next=await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});
    saveSession({...next,expires_at:Math.floor(Date.now()/1000)+next.expires_in});
    return session.access_token;
  }catch(e){saveSession(null);throw Error('Sesja wygasła. Zaloguj się ponownie. '+e.message)}
}
class TableQuery{
  constructor(table){this.table=table;this.method='GET';this.columns='*';this.filters=[];this.payload=null;this.sort=null;this.count=null}
  select(cols){this.columns=cols;return this}
  eq(field,value){this.filters.push([field,'eq.'+String(value)]);return this}
  limit(n){this.count=n;return this}
  order(field,{ascending=true}={}){this.sort=field+'.'+(ascending?'asc':'desc');return this}
  insert(value){this.method='POST';this.payload=value;return this}
  update(value){this.method='PATCH';this.payload=value;return this}
  delete(){this.method='DELETE';return this}
  async execute(){
    try{
      const token=await accessToken();if(!token)throw Error('Nie jesteś zalogowany.');
      const qs=new URLSearchParams();if(this.method==='GET')qs.set('select',this.columns);
      for(const [k,v] of this.filters)qs.append(k,v);
      if(this.sort)qs.set('order',this.sort);
      if(this.count!==null)qs.set('limit',String(this.count));
      const data=await request('/rest/v1/'+encodeURIComponent(this.table)+'?'+qs.toString(),this.method,this.payload,token,{'Prefer':this.method==='GET'?'':'return=minimal'});
      return {data:this.method==='GET'?data:null,error:null};
    }catch(error){return {data:null,error}}
  }
  then(ok,fail){return this.execute().then(ok,fail)}
}
const client={

async function load(){status('Pobieranie danych…');try{const {data:userData,error:userError}=await client.auth.getUser();if(userError)throw userError;const uid=userData.user?.id;if(!uid)throw Error('Sesja wygasła. Zaloguj się ponownie.');let r=await client.from('family_members').select('id,family_id,name,user_id,role').eq('user_id',uid).limit(1);if(r.error)throw r.error;familyId=r.data?.[0]?.family_id;if(!familyId){const own=await client.from('families').select('id').eq('owner_id',uid).limit(1);if(own.error)throw own.error;familyId=own.data?.[0]?.id}if(!familyId)throw Error('Nie znaleziono rodziny powiązanej z tym kontem. W Supabase trzeba powiązać użytkownika z rodziną.');const [m,s,t]=await Promise.all([client.from('family_members').select('id,family_id,name,user_id,role').eq('family_id',familyId),client.from('shopping_items').select('id,text,done,created_by,created_at').eq('family_id',familyId).order('created_at',{ascending:false}),client.from('tasks').select('id,text,done,assigned_to,created_at').eq('family_id',familyId).order('created_at',{ascending:false})]);for(const r of [m,s,t])if(r.error)throw r.error;members=m.data||[];shopping=s.data||[];tasks=t.data||[];status('✓ Połączono z Supabase • '+new Date().toLocaleTimeString('pl-PL'));render()}catch(e){status('Błąd synchronizacji: '+err(e),true);render()}}
async function mutation(query){if(busy)return;busy=true;status('Zapisywanie…');try{const {error}=await query;if(error)throw error;await load()}catch(e){status('Nie zapisano zmiany: '+err(e),true)}finally{busy=false}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const isDad=current==='tata';if(!familyId){el('content').innerHTML='<h2>Połączenie z rodziną</h2><p class="muted">Najpierw trzeba poprawnie powiązać konto z rodziną w Supabase.</p>';return}if(tab==='zakupy'){el('content').innerHTML='<h2>🛒 Lista zakupów</h2><form id="addShopping" class="row"><input id="newShopping" maxlength="120" required placeholder="Co trzeba kupić?"><button class="primary">Dodaj</button></form><div id="items">'+(shopping.map(x=>'<div class="item"><span class="label">'+esc(x.text)+'</span><button class="secondary" data-buy="'+esc(x.id)+'">✓ Kupione</button></div>').join('')||'<p class="muted">Lista jest pusta.</p>')+'</div>';el('addShopping').onsubmit=e=>{e.preventDefault();const text=el('newShopping').value.trim();if(text){(async()=>{try{const {data,error}=await client.auth.getUser();if(error)throw error;const uid=data?.user?.id;if(!uid)throw Error('Sesja wygasła. Zaloguj się ponownie.');await mutation(client.from('shopping_items').insert({family_id:familyId,text,done:false,created_by:uid}))}catch(e){status('Nie zapisano zmiany: '+err(e),true)}})()}};document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>mutation(client.from('shopping_items').delete().eq('id',b.dataset.buy).eq('family_id',familyId)));return}const visible=isDad?tasks:tasks.filter(x=>x.assigned_to===memberId(current));const options=members.filter(m=>m.name&&String(m.name).toLowerCase()!=='tata'&&m.id).map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('');el('content').innerHTML='<h2>✅ Zadania domowe</h2>'+(isDad?'<form id="addTask"><input id="newTask" maxlength="120" required placeholder="Jakie zadanie?"><select id="assigned">'+options+'</select><button class="primary" '+(!options?'disabled':'')+'>Dodaj zadanie</button></form>':'<p class="muted">Zadania przydziela i zatwierdza Tata.</p>')+(visible.map(x=>'<div class="item"><span class="label" style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(x.text)+'<div class="muted">'+esc(nameOf(x.assigned_to))+'</div></span>'+(isDad?'<button class="secondary" data-done="'+esc(x.id)+'" data-state="'+(x.done?'1':'0')+'">'+(x.done?'↩':'✓')+'</button><button class="secondary" data-del="'+esc(x.id)+'">×</button>':'')+'</div>').join('')||'<p class="muted">Brak zadań.</p>');if(isDad){el('addTask').onsubmit=e=>{e.preventDefault();const text=el('newTask').value.trim(),assigned_to=el('assigned').value;if(text&&assigned_to)createTaskAndNotify(text,assigned_to)};document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>mutation(client.from('tasks').update({done:b.dataset.state!=='1'}).eq('id',b.dataset.done).eq('family_id',familyId)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>mutation(client.from('tasks').delete().eq('id',b.dataset.del).eq('family_id',familyId)))}}
el('loginBtn').onclick=login;el('loginBtn').setAttribute('data-ready','tak');el('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});el('refresh').onclick=load;el('logout').onclick=async()=>{await client.auth.signOut();current=null;familyId=null;members=[];shopping=[];tasks=[];el('app').classList.add('hide');el('login').classList.remove('hide');el('hello').textContent='Rodzinna ekipa 👋';el('who').textContent='Wspólne zakupy i zadania'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(client){client.auth.getUser().then(({data})=>{if(data.user)start(data.user).catch(e=>{el('loginError').textContent=err(e);el('app').classList.add('hide');el('login').classList.remove('hide')})}).catch(e=>{el('loginError').textContent='Błąd połączenia: '+err(e)});}else{el('loginError').textContent='Nie udało się załadować Supabase. Logowanie jest chwilowo niedostępne.';}

function localRead(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function localWrite(key,data){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){alert('Nie udało się zapisać na tym telefonie. '+e.message);return false}}
const budgetKey='mafiango_budget_v1';
const mattersKey='mafiango_matters_v1';
function money(n){return Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'})}
function renderBudget(){
 const entries=localRead(budgetKey),income=entries.filter(x=>x.type==='plus').reduce((a,x)=>a+x.amount,0),cost=entries.filter(x=>x.type==='minus').reduce((a,x)=>a+x.amount,0);
 el('content').innerHTML='<h2>🪙 Budżet rodzinny</h2><div class="money-summary"><div><small>Wpływy</small><b>'+money(income)+'</b></div><div><small>Wydatki</small><b>'+money(cost)+'</b></div><div class="balance"><small>Pozostało</small><b>'+money(income-cost)+'</b></div></div><form class="form-local" id="addBudget"><input id="budgetName" maxlength="90" required placeholder="Opis, np. Zakupy spożywcze"><div class="field-grid"><input id="budgetAmount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="Kwota zł"><select id="budgetType"><option value="minus">Wydatek</option><option value="plus">Wpływ</option></select></div><button class="primary">Dodaj do budżetu</button></form><div>'+entries.slice().reverse().map(x=>'<div class="item"><span class="label">'+esc(x.name)+'<div class="muted">'+(x.type==='plus'?'Wpływ':'Wydatek')+'</div></span><b>'+ (x.type==='plus'?'+':'−')+money(x.amount)+'</b><button class="secondary smallbtn" data-budget-delete="'+esc(x.id)+'" aria-label="Usuń">×</button></div>').join('')+'</div><p class="info-note">Budżet jest obecnie zapisywany tylko na tym telefonie. Nie synchronizuje się z Supabase.</p>';
 el('addBudget').onsubmit=e=>{e.preventDefault();const name=el('budgetName').value.trim(),amount=Number(el('budgetAmount').value),type=el('budgetType').value;if(!name||!Number.isFinite(amount)||amount<=0)return;const data=localRead(budgetKey);data.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name,amount,type});if(localWrite(budgetKey,data))renderBudget()};
 document.querySelectorAll('[data-budget-delete]').forEach(b=>b.onclick=()=>{if(localWrite(budgetKey,localRead(budgetKey).filter(x=>x.id!==b.dataset.budgetDelete)))renderBudget()});
}
function renderMatters(){
 const entries=localRead(mattersKey);
 el('content').innerHTML='<h2>🗒️ Moje sprawy</h2><form class="form-local" id="addMatter"><input id="matterName" maxlength="130" required placeholder="Co masz do załatwienia?"><button class="primary">Dodaj sprawę</button></form><div>'+(entries.map(x=>'<div class="item"><button class="secondary smallbtn" data-matter-done="'+esc(x.id)+'" aria-label="Zmień status">'+(x.done?'☑':'☐')+'</button><span class="label" style="'+(x.done?'text-decoration:line-through;opacity:.55':'')+'">'+esc(x.name)+'</span><button class="secondary smallbtn" data-matter-delete="'+esc(x.id)+'" aria-label="Usuń">×</button></div>').join('')||'<p class="muted">Nie masz jeszcze zapisanych spraw.</p>')+'</div><p class="info-note">Moje sprawy są prywatne i zapisane tylko na tym telefonie. Nie synchronizują się z Supabase.</p>';
 el('addMatter').onsubmit=e=>{e.preventDefault();const name=el('matterName').value.trim();if(!name)return;const data=localRead(mattersKey);data.unshift({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),name,done:false});if(localWrite(mattersKey,data))renderMatters()};
 document.querySelectorAll('[data-matter-done]').forEach(b=>b.onclick=()=>{const data=localRead(mattersKey);const item=data.find(x=>x.id===b.dataset.matterDone);if(item){item.done=!item.done;if(localWrite(mattersKey,data))renderMatters()}});
 document.querySelectorAll('[data-matter-delete]').forEach(b=>b.onclick=()=>{if(localWrite(mattersKey,localRead(mattersKey).filter(x=>x.id!==b.dataset.matterDelete)))renderMatters()});
}
render=function(){
 const dad=current==='tata';
 document.querySelectorAll('.dad-only').forEach(b=>b.hidden=!dad);
 if(!dad&&tab==='budzet')tab='zadania';
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const hero=document.getElementById('heroAvatar');
 if(current&&avatarImages[current]){hero.src=avatarImages[current];hero.style.display='block'}else{hero.style.display='none'}
 if(!familyId){originalRender();return}
 if(dad&&tab==='budzet'){renderBudget();return}
 if(tab==='sprawy'){renderFamilyMatters();return}
 originalRender();
 // Dołóż awatary przy istniejących zadaniach, nie zmieniając zapisu do bazy.
 if(tab==='zadania')document.querySelectorAll('#content .item').forEach(item=>{
  const name=item.querySelector('.label .muted')?.textContent?.trim().toLowerCase();
  const key=avatarKeys.find(k=>accounts[k].name.toLowerCase()===name);
  if(key){const img=document.createElement('img');img.className='avatar-mini';img.alt='Awatar '+accounts[key].name;img.src=avatarImages[key];item.insertBefore(img,item.firstChild)}
 });
};

// 16.10i: sprawy rodzinne przechowywane w Supabase; stary lokalny budżet bez zmian.
let familyMatters=[],matterSyncError='';
const previousLoad=load;
load=async function(){
 await previousLoad();
 if(!familyId||!current)return;
 try{
  const r=await client.from('family_matters').select('id,family_id,member_id,text,done,due_at,remind_at,created_at').eq('family_id',familyId).order('created_at',{ascending:false});
  if(r.error)throw r.error;
  familyMatters=r.data||[];matterSyncError='';
 }catch(e){matterSyncError=err(e);familyMatters=[]}
 if(tab==='sprawy')render();
};
function dateForInput(iso){if(!iso)return '';const d=new Date(iso);const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);return local.toISOString().slice(0,16)}
function formatDue(iso){return iso?new Date(iso).toLocaleString('pl-PL',{dateStyle:'medium',timeStyle:'short'}):'Bez terminu'}
function renderFamilyMatters(){
 const own=memberId(current);
 if(!own){el('content').innerHTML='<h2>🗒️ Moje sprawy</h2><p class="error">Nie znaleziono Twojego profilu w rodzinie.</p>';return}
 const dad=current==='tata';
 const visible=dad?familyMatters:familyMatters.filter(x=>x.member_id===own);
 const groups=dad?[['tata','👑 Moje sprawy'],['marcel','🎮 Sprawy Marcela'],['filip','⚽ Sprawy Filipa'],['antek','🧸 Sprawy Antka']]:[[current,'🗒️ Moje sprawy']];
 const legacy=dad?localRead(mattersKey):[];
 el('content').innerHTML='<h2>🗒️ Moje sprawy</h2>'+
 (matterSyncError?'<p class="error">Sprawy nie są jeszcze zsynchronizowane. W Supabase trzeba uruchomić dołączony plik SQL. '+esc(matterSyncError)+'</p>':'')+
 '<form class="form-local" id="addFamilyMatter"><input id="matterText" maxlength="130" required placeholder="Co masz do załatwienia?">'+
 '<label for="matterDue">Termin (opcjonalnie)</label><input type="datetime-local" id="matterDue">'+
 '<label for="matterReminder">Przypomnij (opcjonalnie)</label><input type="datetime-local" id="matterReminder">'+
 '<button class="primary" '+(matterSyncError?'disabled':'')+'>Dodaj sprawę</button></form>'+
 groups.map(([key,title])=>{const mid=memberId(key);const arr=visible.filter(x=>x.member_id===mid);return '<h3>'+title+'</h3>'+
 (arr.map(x=>'<div class="item"><button class="secondary smallbtn" data-fmatter-done="'+esc(x.id)+'" data-state="'+(x.done?'1':'0')+'" '+(!dad&&x.member_id!==own?'disabled':'')+'>'+(x.done?'☑':'☐')+'</button><span class="label" style="'+(x.done?'text-decoration:line-through;opacity:.55':'')+'">'+esc(x.text)+'<div class="muted">'+esc(formatDue(x.due_at))+'</div></span>'+(x.member_id===own?'<button class="secondary smallbtn" data-fmatter-delete="'+esc(x.id)+'">×</button>':'')+'</div>').join('')||'<p class="muted">Brak spraw.</p>')}).join('')+
 (legacy.length?'<p class="info-note">Masz też '+legacy.length+' spraw zapisanych wcześniej lokalnie w 16.10e. Nie zostały automatycznie przeniesione do Supabase.</p>':'')+
 '<p class="info-note">Sprawy synchronizują się po uruchomieniu konfiguracji SQL. Powiadomienia push przy zamkniętej aplikacji wymagają osobnego uruchomienia usługi wysyłającej.</p>';
 el('addFamilyMatter').onsubmit=e=>{e.preventDefault();const text=el('matterText').value.trim(),due=el('matterDue').value,remind=el('matterReminder').value;if(!text)return;

  });
})();

    const items=[...ingredientsDraft.items.filter(x=>x.checked).map(x=>x.name.trim()),...extra].filter(Boolean);
    if(!items.length)throw Error('Zaznacz lub wpisz składniki');
    const u=await client.auth.getUser();if(u.error||!u.data?.user?.id)throw Error('Brak sesji');
    const existing=new Set(shopping.map(x=>x.text.toLocaleLowerCase('pl')));
    const unique=[...new Set(items)].filter(x=>!existing.has(x.toLocaleLowerCase('pl')));
    if(!unique.length){alert('Te składniki są już na liście zakupów.');return}
    const r=await client.from('shopping_items').insert(unique.map(text=>({family_id:familyId,text,done:false,created_by:u.data.user.id})));
    if(r.error)throw r.error;
    await load();alert('Dodano '+unique.length+' produktów do listy zakupów!');
   });
  }
 }
 const baseRender=render;
 render=function(){if(tab==='jedzenie'){renderMeals();return}baseRender()};
 const button=document.createElement('button');button.type='button';button.dataset.tab='jedzenie';button.innerHTML='<span class="tab-icon">🍽️</span>Jedzenie';document.querySelector('.tabs').appendChild(button);
 button.onclick=()=>{tab='jedzenie';render();syncMeals()};
 const baseLoad=load;load=async function(){await baseLoad();if(current&&familyId)await syncMeals()};
 mealTimer=setInterval(()=>{if(current&&familyId&&!document.hidden&&!mealBusy)syncMeals()},20000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&current&&familyId)syncMeals()});
})();
