<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6658eb"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>MaFiAnGo – rodzinna ekipa</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#262642;background:#f6f5fc;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f1efff 0,#f8f8ff 280px,#f6f5fc 100%)}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f3aaec;outline-offset:2px}
.wrap{max-width:740px;margin:0 auto;padding:16px 16px calc(104px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(125deg,#6254eb 0%,#8665f0 55%,#e979bd 100%);color:white;border-radius:28px;padding:24px;box-shadow:0 14px 32px #6355d92b;position:relative;overflow:hidden}
.hero:after{content:'✦';position:absolute;right:12px;top:-28px;font-size:150px;color:#ffffff16;pointer-events:none}.brand{font-size:15px;font-weight:850;letter-spacing:.5px;opacity:.92}.hello{font-size:29px;line-height:1.2;margin:22px 0 6px;position:relative;z-index:1}.hero p{margin:0 0 18px;opacity:.9}.hero-tag{display:inline-flex;gap:8px;align-items:center;border:1px solid #ffffff55;border-radius:30px;background:#ffffff25;padding:7px 12px;font-size:12px;font-weight:750}
.panel{background:white;border:1px solid #eeedf7;border-radius:23px;padding:19px;margin-top:16px;box-shadow:0 7px 24px #3b31540b}.panel h2{font-size:18px;letter-spacing:-.3px;margin:0 0 14px}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-heading h2{margin:0 0 13px}.muted{color:#85849b;font-size:13px;line-height:1.5}.profile-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.profile{display:flex;flex-direction:column;align-items:center;gap:7px;background:#f7f6fc;border:2px solid transparent;border-radius:17px;padding:12px 3px;color:#514f6b;font-weight:750;font-size:12px;min-width:0}.profile.selected{background:#f0edff;border-color:#8b7afa;color:#5441d3}.avatar{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#e9e5ff}.avatar.marcel{background:#e5f0ff}.avatar.filip{background:#e1f8e9}.avatar.antek{background:#fff0df}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.stat{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px 12px;background:#fff;border:1px solid #eeedf7;border-radius:20px;box-shadow:0 6px 20px #3b315409}.stat>span{font-size:21px}.stat strong{font-size:27px;color:#5145cc;line-height:1.15}.stat small{color:#88869d;font-size:11px;line-height:1.3}.percent{font-weight:850;color:#6859e6}.progress-track{height:12px;border-radius:100px;background:#eeeafb;overflow:hidden;margin:9px 0}.progress-fill{height:100%;background:linear-gradient(90deg,#7462f5,#e777b8);border-radius:100px;transition:width .25s}.progress-panel p{margin:8px 0 0}.family-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.family-card{border:0;border-radius:18px;background:#edf4ff;color:#2957a3;padding:15px 6px;display:flex;flex-direction:column;align-items:center;gap:5px}.family-card.filip{background:#eaf9ef;color:#23834a}.family-card.antek{background:#fff2e4;color:#a76121}.family-emoji{font-size:29px}.family-card strong{font-size:14px}.family-card small{font-size:11px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{border:1px solid #eceafb;background:#f9f8ff;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:4px;padding:15px;color:#302d59}.quick span{font-size:25px}.quick strong{font-size:14px}.quick small{color:#9290a5;font-size:12px}
.tabbar{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid #e9e7f2;padding:9px max(8px,calc((100vw - 740px)/2 + 12px)) calc(9px + env(safe-area-inset-bottom));display:flex;gap:4px;justify-content:space-around}.tab{min-width:0;flex:1;border:0;border-radius:13px;background:transparent;color:#8d8a9e;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:8px 2px;font-size:10px;font-weight:750}.tab-icon{font-size:21px}.tab.active{color:#6150df;background:#f0edff}
.field-label{display:block;font-size:12px;font-weight:800;color:#79758d;margin:8px 0 6px}input,select{width:100%;min-width:0;padding:13px;border:1px solid #e1dfef;border-radius:13px;background:#fff;color:#252440;font-size:15px}select{margin-bottom:8px}.form{display:flex;gap:8px;margin:12px 0}.form input{flex:1}.add-btn{border:0;border-radius:13px;background:#6757ed;color:white;padding:0 16px;font-weight:750;white-space:nowrap}.count{background:#f1efff;color:#6654dc;padding:5px 11px;border-radius:30px;font-size:12px;font-weight:800}.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #f0eef7}.item-icon{width:35px;height:35px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:#f0edff;color:#6656e9}.item-icon.finished{background:#e7f9ee;color:#2e9c58;font-weight:850}.item-content{flex:1;min-width:0;overflow-wrap:anywhere}.item-content strong{display:block;font-size:14px;font-weight:700}.item-content small{display:block;color:#8d8aa0;font-size:11px;margin-top:4px}.done{text-decoration:line-through;opacity:.5}.item-actions{display:flex;gap:5px}.icon-btn{border:0;background:#efedff;color:#6151d6;border-radius:11px;min-width:35px;height:35px;font-size:19px;font-weight:800}.icon-btn.danger{background:#fff0f1;color:#c85671}.empty{display:flex;align-items:center;flex-direction:column;gap:7px;text-align:center;padding:32px 12px;color:#49445f}.empty span{font-size:37px}.empty small{font-size:12px;color:#9290a5}.note{text-align:center;margin:15px}.foot{text-align:center;color:#a19db4;font-size:11px;margin:18px 0}
body[data-role="marcel"] .hero{background:linear-gradient(125deg,#435edb,#7d8bf7,#b46fdc)}body[data-role="filip"] .hero{background:linear-gradient(125deg,#27916b,#4ec1a1,#81c9a6)}body[data-role="antek"] .hero{background:linear-gradient(125deg,#ed8b3c,#f1aa62,#ed80a3)}
@media(max-width:360px){.wrap{padding:11px 11px 104px}.hero{padding:19px}.hello{font-size:25px}.profile-row{gap:5px}.avatar{width:37px;height:37px}.profile{font-size:11px}.panel{padding:15px}.stat{padding:12px 8px}.form{gap:6px}.add-btn{padding:0 11px}}
</style></head><body data-role="tata">
<div class="wrap">
<header class="hero"><div class="brand">🏡 MaFiAnGo</div><h1 class="hello" id="greeting">Cześć, Tato! 👋</h1><p id="subtitle">Wasz rodzinny plan na dziś</p><span class="hero-tag">✨ <span id="who">Panel rodzica</span></span></header>
<section class="panel"><h2>👨‍👦‍👦 Wybierz profil</h2><div id="profiles" class="profile-row"></div><p class="muted" style="margin:12px 0 0">Wersja demonstracyjna – profile nie są zabezpieczone PIN-em.</p></section>
<main id="main"></main><footer class="foot">MaFiAnGo • dane zapisane na tym urządzeniu</footer>
</div><nav id="tabs" class="tabbar" aria-label="Menu aplikacji"></nav>
<script>
let role='tata',tab='zakupy';const key='mafiango-demo-v1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch(e){}db=db||{zakupy:[],zadania:[],sprawy:[]};function save(){localStorage.setItem(key,JSON.stringify(db));render()}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function add(type){const e=document.getElementById('new');let v=e.value.trim();if(!v)return;let owner=type==='zadania'?document.getElementById('owner').value:'tata';db[type].push({text:v,owner,done:false,author:role});save()}function toggle(type,i){if(type==='zadania'&&role!=='tata')return;db[type][i].done=!db[type][i].done;save()}function remove(type,i){if(role!=='tata')return;db[type].splice(i,1);save()}function chooseRole(next){role=next;tab=next==='tata'?'start':'zadania';render()}
function chooseTab(next){tab=next;render()}
function render(){
 const isDad=role==='tata';
 const names={tata:'Tata',Marcel:'Marcel',Filip:'Filip',Antek:'Antek'};
 const labels={zakupy:'Lista zakupów',zadania:'Zadania domowe',sprawy:'Moje sprawy'};
 const icons={zakupy:'🛒',zadania:'✅',sprawy:'🔔'};
 const allowed=isDad?['start','zadania','zakupy','sprawy']:['start','zadania','zakupy'];
 if(!allowed.includes(tab))tab='start';
 document.body.dataset.role=role.toLowerCase();
 document.getElementById('who').textContent=isDad?'Panel rodzica':'Panel: '+role;
 document.getElementById('greeting').textContent=isDad?'Cześć, Tato! 👋':'Cześć, '+role+'! 👋';
 document.getElementById('subtitle').textContent=isDad?'Wasz rodzinny plan na dziś':'Twoje zadania i rodzinne sprawy';
 document.getElementById('profiles').innerHTML=['tata','Marcel','Filip','Antek'].map((x)=>`<button class="profile ${role===x?'selected':''}" onclick="chooseRole('${x}')"><span class="avatar ${x.toLowerCase()}">${({tata:'👑',Marcel:'🎮',Filip:'⚽',Antek:'🦸'})[x]}</span><span>${names[x]}</span></button>`).join('');
 document.getElementById('tabs').innerHTML=allowed.map(x=>`<button class="tab ${tab===x?'active':''}" onclick="chooseTab('${x}')"><span class="tab-icon">${x==='start'?'🏠':icons[x]}</span><span>${x==='start'?'Start':x==='sprawy'?'Sprawy':labels[x]}</span></button>`).join('');
 const own=db.zadania.filter(x=>isDad||x.owner===role);
 const completed=own.filter(x=>x.done).length;
 const pending=own.length-completed;
 const pct=own.length?Math.round(completed/own.length*100):0;
 if(tab==='start'){
  const children=['Marcel','Filip','Antek'];
  const stats=isDad?`<div class="stats"><div class="stat"><span>📋</span><strong>${db.zadania.length}</strong><small>Wszystkie zadania</small></div><div class="stat"><span>✨</span><strong>${db.zadania.filter(x=>x.done).length}</strong><small>Wykonane</small></div><div class="stat"><span>🛒</span><strong>${db.zakupy.filter(x=>!x.done).length}</strong><small>Do kupienia</small></div></div>`:`<div class="stats"><div class="stat"><span>🎯</span><strong>${own.length}</strong><small>Twoje zadania</small></div><div class="stat"><span>✅</span><strong>${completed}</strong><small>Wykonane</small></div><div class="stat"><span>🚀</span><strong>${pending}</strong><small>Do zrobienia</small></div></div>`;
  const progress=`<section class="panel progress-panel"><div class="section-heading"><h2>📋 ${isDad?'Postęp rodziny':'Twój postęp'}</h2><span class="percent">${pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><p class="muted">${completed} z ${own.length} zadań ukończonych ${isDad?'w rodzinie':''}</p></section>`;
  const family=isDad?`<section class="panel"><div class="section-heading"><h2>👨‍👦‍👦 Nasza ekipa</h2></div><div class="family-grid">${children.map(x=>{const arr=db.zadania.filter(t=>t.owner===x),d=arr.filter(t=>t.done).length;return `<button class="family-card ${x.toLowerCase()}" onclick="chooseRole('${x}')"><span class="family-emoji">${({Marcel:'🎮',Filip:'⚽',Antek:'🦸'})[x]}</span><strong>${x}</strong><small>${d}/${arr.length} zadań</small></button>`}).join('')}</div></section>`:'';
  const quick=`<section class="panel"><h2>⚡ Szybki dostęp</h2><div class="quick-grid"><button class="quick" onclick="chooseTab('zadania')"><span>✅</span><strong>Zadania</strong><small>Sprawdź plan</small></button><button class="quick" onclick="chooseTab('zakupy')"><span>🛒</span><strong>Zakupy</strong><small>Lista rodzinna</small></button></div></section>`;
  document.getElementById('main').innerHTML=stats+progress+family+quick;
  return;
 }
 const arr=db[tab];
 const show=tab==='zadania'&&!isDad?arr.filter(x=>x.owner===role):arr;
 const form=(isDad||tab==='zakupy')?`<div class="form"><input id="new" maxlength="120" aria-label="Nowy wpis" placeholder="${({zakupy:'Co trzeba kupić?',zadania:'Jakie zadanie?',sprawy:'Co trzeba załatwić?'})[tab]}"><button class="add-btn" onclick="add('${tab}')">＋ Dodaj</button></div>`:'';
 const ownerSelect=tab==='zadania'&&isDad?'<label class="field-label" for="owner">Przydziel zadanie</label><select id="owner"><option>Marcel</option><option>Filip</option><option>Antek</option></select>':'';
 const list=show.map(x=>{const i=arr.indexOf(x),canCheck=isDad||tab==='zakupy';return `<div class="item"><span class="item-icon ${x.done?'finished':''}">${x.done?'✓':icons[tab]}</span><span class="item-content"><strong class="${x.done?'done':''}">${safe(x.text)}</strong>${tab==='zakupy'?`<small>Dodał: ${x.author==='tata'?'Tata':safe(x.author)}</small>`:''}${tab==='zadania'&&isDad?`<small>Dla: ${safe(x.owner)}</small>`:''}</span><span class="item-actions">${canCheck?`<button class="icon-btn" aria-label="Zmień stan" onclick="toggle('${tab}',${i})">${x.done?'↩':'✓'}</button>`:''}${isDad?`<button class="icon-btn danger" aria-label="Usuń" onclick="remove('${tab}',${i})">×</button>`:''}</span></div>`}).join('');
 document.getElementById('main').innerHTML=`<section class="panel content-panel"><div class="section-heading"><h2>${icons[tab]} ${labels[tab]}</h2><span class="count">${show.length}</span></div>${tab==='zadania'&&!isDad?'<p class="muted">Zadania przydziela i zatwierdza Tata.</p>':''}${ownerSelect}${form}<div class="items">${list||'<div class="empty"><span>🌈</span><strong>Na razie tutaj pusto</strong><small>Nowe wpisy pojawią się właśnie tutaj.</small></div>'}</div></section>${tab==='sprawy'?'<p class="muted note">🔔 Powiadomienia dodamy w przyszłości.</p>':''}`;
}
;render();
</script>
</body></html>
