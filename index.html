<!doctype html><html lang="pl"><head><link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#6554ef"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#635bff"><title>MaFiAnGo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ff;color:#232444;font:16px system-ui,Arial}.wrap{max-width:650px;margin:auto;padding:18px}header{background:linear-gradient(120deg,#6257f5,#ee65aa);color:white;padding:25px;border-radius:24px}h1{margin:0;font-size:30px}h2{font-size:20px}small{opacity:.8}.panel{background:white;border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 5px 20px #23244410}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:13px;background:#665bf5;color:white;padding:11px 14px;font-size:15px;cursor:pointer}button.secondary{background:#ecebff;color:#463ac8}button.danger{background:#ffe5e8;color:#ad2944}input,select{padding:12px;border:1px solid #d8d8e9;border-radius:12px;font-size:16px;min-width:0;width:100%}.form{display:flex;gap:8px;margin:12px 0}.form button{flex-shrink:0}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #eee;padding:12px 0}.item span{flex:1}.muted{color:#6f7187;font-size:13px}.done{text-decoration:line-through;opacity:.55}.hide{display:none}.chip{display:inline-block;padding:7px 10px;border-radius:10px;background:#fff2d8;color:#8d5900;font-weight:600}footer{text-align:center;color:#8385a0;font-size:12px;margin:22px}
</style></head><body><div class="wrap"><header><h1>🏡 MaFiAnGo</h1><div>Tata dowodzi, ekipa ogarnia! 🚀</div><p id="who">Wersja demonstracyjna</p></header><section class="panel"><h2>👨‍👦‍👦 Wybierz ekran</h2><div class="nav"><button onclick="role='tata';render()">👑 Tata</button><button class="secondary" onclick="role='Marcel';render()">🎮 Marcel</button><button class="secondary" onclick="role='Filip';render()">⚽ Filip</button><button class="secondary" onclick="role='Antek';render()">🦸 Antek</button></div><p class="muted">To demonstracja wyglądu. Wybór profilu nie jest jeszcze bezpiecznym logowaniem PIN.</p></section><section class="panel"><div class="nav" id="tabs"></div></section><main id="main"></main><footer>MaFiAnGo • wersja 0.1 • dane tylko na tym urządzeniu</footer></div><script>
let role='tata',tab='zakupy';const key='mafiango-demo-v1';let db;try{db=JSON.parse(localStorage.getItem(key))}catch(e){}db=db||{zakupy:[],zadania:[],sprawy:[],nagrody:[]};function save(){localStorage.setItem(key,JSON.stringify(db));render()}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function add(type){const e=document.getElementById('new');let v=e.value.trim();if(!v)return;let owner=type==='zadania'?document.getElementById('owner').value:'tata';db[type].push({text:v,owner,done:false,author:role});save()}function toggle(type,i){if(type==='zadania'&&role!=='tata')return;db[type][i].done=!db[type][i].done;save()}function remove(type,i){if(role!=='tata')return;db[type].splice(i,1);save()}function render(){document.getElementById('who').textContent=role==='tata'?'👑 Panel taty':'🌟 Panel: '+role;const allowed=role==='tata'?['zakupy','zadania','sprawy','nagrody']:['zakupy','zadania'];if(!allowed.includes(tab))tab='zadania';document.getElementById('tabs').innerHTML=allowed.map(x=>`<button class="${tab===x?'':'secondary'}" onclick="tab='${x}';render()">${({zakupy:'🛒 Zakupy',zadania:'✅ Zadania',sprawy:'🔔 Moje sprawy',nagrody:'🏆 Nagrody'})[x]}</button>`).join('');let arr=db[tab];let title=({zakupy:'🛒 Lista zakupów',zadania:'📅 Zadania domowe',sprawy:'🔔 Moje sprawy i rachunki',nagrody:'🏆 Nagrody'})[tab];let show=tab==='zadania'&&role!=='tata'?arr.filter(x=>x.owner===role):arr;let form=(role==='tata'||tab==='zakupy')?`<div class="form"><input id="new" maxlength="120" placeholder="${tab==='zakupy'?'Co kupić?':tab==='zadania'?'Jakie zadanie?':tab==='sprawy'?'Co musisz zrobić?':'Jaka nagroda?'}"><button onclick="add('${tab}')">Dodaj</button></div>`:'';if(tab==='zadania'&&role==='tata')form=`<select id="owner"><option>Marcel</option><option>Filip</option><option>Antek</option></select>`+form;let list=show.map(x=>{let i=arr.indexOf(x),canCheck=role==='tata'||tab==='zakupy';return `<div class="item"><span class="${x.done?'done':''}">${safe(x.text)} ${tab==='zakupy'?`<div class="muted">Dodał: ${x.author==='tata'?'Tato':safe(x.author)}</div>`:''}${tab==='zadania'&&role==='tata'?`<div class="muted">Dla: ${safe(x.owner)}</div>`:''}</span>${canCheck?`<button class="secondary" onclick="toggle('${tab}',${i})">${x.done?'↩':'✓'}</button>`:''}${role==='tata'?`<button class="danger" onclick="remove('${tab}',${i})">×</button>`:''}</div>`}).join('');document.getElementById('main').innerHTML=`<section class="panel"><h2>${title}</h2>${tab==='zadania'&&role!=='tata'?'<p class="muted">Zadania przydziela i zatwierdza tata.</p>':''}${form}${list||'<p class="muted">Na razie pusto.</p>'}</section>${tab==='sprawy'?'<section class="panel"><span class="chip">🔔 Powiadomienia dodamy po połączeniu z Firebase</span></section>':''}`};render();
</script></body></html>
